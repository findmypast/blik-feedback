{% extends "base_public.html" %}

{% block title %}{{ status_code }} – {{ error_title }}{% endblock %}

{% block content %}
<main class="container" style="max-width:680px;margin:4rem auto;padding:0 1rem;">
    <div class="card">
        <div class="card-body" style="padding:2rem;text-align:center;">
            <p style="margin:0;color:var(--text-secondary);font-size:1.1rem;font-weight:600;">Error {{ status_code }}</p>
            <h1 style="margin:.5rem 0 1rem;">{{ error_title }}</h1>
            <p style="margin:0 auto 1.5rem;max-width:520px;color:var(--text-secondary);">{{ error_message }}</p>
            {% if request.user.is_authenticated %}
                <a class="btn btn-primary" href="{% url 'admin_dashboard' %}">Go back to Dashboard</a>
            {% else %}
                <a class="btn btn-primary" href="{% url 'login' %}">Go to Login</a>
            {% endif %}
        </div>
    </div>
</main>
{% endblock %}
